"#fff0e9"/><text x="55" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#554051">Evitar la descarga y avisar al soporte autorizado</text><rect x="40" y="597" width="820" height="42" fill="#fff0e9"/><text x="55" y="623" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#554051">Instalar el limpiador anunciado</text><text x="40" y="664" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#964125">Defensa reforzada: +100 XP. Energía sin cambios.</text><text x="40" y="698" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#554051">Una alerta falsa puede inducir a instalar software dañino. Usa los canales de soporte</text><text x="40" y="722" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#554051">establecidos.</text><rect x="625" y="150" width="5" height="5" fill="#f5a623"/><rect x="641" y="155" width="5" height="5" fill="#d35274"/><rect x="657" y="160" width="5" height="5" fill="#398578"/><rect x="673" y="150" width="5" height="5" fill="#f5a623"/><rect x="689" y="155" width="5" height="5" fill="#d35274"/><rect x="705" y="160" width="5" height="5" fill="#398578"/><rect x="721" y="150" width="5" height="5" fill="#f5a623"/><rect x="737" y="155" width="5" height="5" fill="#d35274"/><rect x="753" y="160" width="5" height="5" fill="#398578"/><rect x="769" y="150" width="5" height="5" fill="#f5a623"/><rect x="785" y="155" width="5" height="5" fill="#d35274"/><rect x="801" y="160" width="5" height="5" fill="#398578"/><rect x="40" y="756" width="820" height="42" fill="#fff0e9"/><text x="55" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#554051">Continuar</text><text x="40" y="829" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#554051">Reiniciar esta misión</text><text x="40" y="859" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#554051">Mockup de diseño · No es una captura de ejecución</text></svg></svg>