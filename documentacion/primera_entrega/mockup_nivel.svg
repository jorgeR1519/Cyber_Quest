><text x="55" y="623" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#354854">Abrir el enlace del mensaje</text><text x="40" y="671" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#354854">Elige cómo actuar. Cada decisión tiene consecuencias.</text><rect x="40" y="705" width="820" height="42" fill="#edf8fa"/><text x="55" y="732" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#354854">Continuar · Disponible después de responder</text><text x="40" y="778" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#354854">Reiniciar esta misión</text><text x="40" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#354854">Mockup de diseño · No es una captura de ejecución</text></svg></svg>