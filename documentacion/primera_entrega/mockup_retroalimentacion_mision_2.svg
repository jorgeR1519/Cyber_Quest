" height="4" fill="#ffe1a3"/><rect x="94" y="94" width="4" height="4" fill="#398578"/><rect x="98" y="94" width="4" height="4" fill="#ffbf69"/><rect x="102" y="94" width="4" height="4" fill="#398578"/><rect x="106" y="94" width="4" height="4" fill="#398578"/><rect x="110" y="94" width="4" height="4" fill="#ffbf69"/><rect x="114" y="94" width="4" height="4" fill="#398578"/><rect x="118" y="94" width="4" height="4" fill="#ffe1a3"/><rect x="98" y="98" width="4" height="4" fill="#398578"/><rect x="102" y="98" width="4" height="4" fill="#398578"/><rect x="106" y="98" width="4" height="4" fill="#398578"/><rect x="110" y="98" width="4" height="4" fill="#398578"/><rect x="98" y="102" width="4" height="4" fill="#398578"/><rect x="110" y="102" width="4" height="4" fill="#398578"/><rect x="94" y="106" width="4" height="4" fill="#493226"/><rect x="98" y="106" width="4" height="4" fill="#493226"/><rect x="110" y="106" width="4" height="4" fill="#493226"/><rect x="114" y="106" width="4" height="4" fill="#493226"/></g><text x="40" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#765021">Ayuda a Leo a reforzar la protección de su cuenta.</text><text x="40" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#304634">Leo reutiliza la misma clave en el correo y en un juego. El juego sufrió</text><text x="40" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#304634">una filtración.</text><rect x="40" y="441" width="820" height="40" fill="#edf3d9"/><text x="55" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#304634">✦ Examinar evidencia</text><text x="40" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#304634">Si dos servicios comparten clave, una filtración puede afectar ambos.</text><rect x="40" y="545" width="820" height="42" fill="#edf3d9"/><text x="55" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#304634">Cambiarla por una contraseña larga y única, guardada en un gestor</text><rect x="40" y="597" width="820" height="42" fill="#edf3d9"/><text x="55" y="623" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#304634">Añadir un 1 a la clave reutilizada</text><text x="40" y="664" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#765021">Defensa reforzada: +100 XP. Energía sin cambios.</text><text x="40" y="698" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#304634">Una contraseña larga y única reduce el riesgo de reutilización. Un gestor permite</text><text x="40" y="722" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#304634">conservar claves distintas.</text><rect x="625" y="150" width="5" height="5" fill="#f5a623"/><rect x="641" y="155" width="5" height="5" fill="#d35274"/><rect x="657" y="160" width="5" height="5" fill="#398578"/><rect x="673" y="150" width="5" height="5" fill="#f5a623"/><rect x="689" y="155" width="5" height="5" fill="#d35274"/><rect x="705" y="160" width="5" height="5" fill="#398578"/><rect x="721" y="150" width="5" height="5" fill="#f5a623"/><rect x="737" y="155" width="5" height="5" fill="#d35274"/><rect x="753" y="160" width="5" height="5" fill="#398578"/><rect x="769" y="150" width="5" height="5" fill="#f5a623"/><rect x="785" y="155" width="5" height="5" fill="#d35274"/><rect x="801" y="160" width="5" height="5" fill="#398578"/><rect x="40" y="756" width="820" height="42" fill="#edf3d9"/><text x="55" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#304634">Continuar</text><text x="40" y="829" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#304634">Reiniciar esta misión</text><text x="40" y="859" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#304634">Mockup de diseño · No es una captura de ejecución</text></svg></svg>