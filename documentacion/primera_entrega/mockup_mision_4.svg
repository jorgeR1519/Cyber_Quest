 UI,Arial,sans-serif" font-size="18" fill="#572e2b">✦ Examinar evidencia</text><text x="40" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#572e2b">El avatar es conocido, pero la petición exige entregar un secreto.</text><rect x="40" y="545" width="820" height="42" fill="#ffe3c9"/><text x="55" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#572e2b">Rechazar la petición y verificar por el canal oficial</text><rect x="40" y="597" width="820" height="42" fill="#ffe3c9"/><text x="55" y="623" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#572e2b">Enviar el código porque parece urgente</text><text x="40" y="671" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#572e2b">Elige cómo actuar. Cada decisión tiene consecuencias.</text><rect x="40" y="705" width="820" height="42" fill="#ffe3c9"/><text x="55" y="732" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#572e2b">Continuar · Disponible después de responder</text><text x="40" y="778" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#572e2b">Reiniciar esta misión</text><text x="40" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#572e2b">Mockup de diseño · No es una captura de ejecución</text></svg></svg>