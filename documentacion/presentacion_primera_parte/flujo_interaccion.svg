<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1036" role="img" aria-label="Interacción con objetos y requisitos"><defs><marker id="punta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a6246"/></marker></defs><rect width="1000" height="1036" fill="#fff7eb"/><text x="500" y="48" text-anchor="middle" font-family="Segoe UI,Arial" font-size="28" fill="#40323d">Interacción con objetos y requisitos</text><rect x="190" y="78" width="620" height="86" rx="12" fill="#eadce9" stroke="#b58764" stroke-width="2"/><text x="500" y="116" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Pulsar E / Enter</text><path d="M500 164 L500 186" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><path d="M500 190 L810 233 L500 276 L190 233 Z" fill="#dfe8cf" stroke="#76936e" stroke-width="2"/><text x="500" y="228" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">¿Hay diálogo? Sí: avanzar texto y terminar</text><path d="M500 276 L500 298" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="302" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="340" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Si no: buscar objeto cercano, sin pared intermedia</text><path d="M500 388 L500 410" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><path d="M500 414 L810 457 L500 500 L190 457 Z" fill="#dfe8cf" stroke="#76936e" stroke-width="2"/><text x="500" y="452" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">¿Existe objeto? No: pedir que se acerque</text><path d="M500 500 L500 522" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="526" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="564" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Sí: comprobar conversación, inventario y requisitos</text><path d="M500 612 L500 634" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><path d="M500 638 L810 681 L500 724 L190 681 Z" fill="#dfe8cf" stroke="#76936e" stroke-width="2"/><text x="500" y="676" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">¿Cumple? No: explicar lo que falta</text><path d="M500 724 L500 746" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="750" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="788" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Sí: actualizar estado y premiar una sola vez</text><path d="M500 836 L500 858" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="862" width="620" height="86" rx="12" fill="#eadce9" stroke="#b58764" stroke-width="2"/><text x="500" y="900" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Mostrar consecuencia, siguiente paso y progreso</text></svg>