<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1036" role="img" aria-label="Flujo de navegación y avance"><defs><marker id="punta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a6246"/></marker></defs><rect width="1000" height="1036" fill="#fff7eb"/><text x="500" y="48" text-anchor="middle" font-family="Segoe UI,Arial" font-size="28" fill="#40323d">Flujo de navegación y avance</text><rect x="190" y="78" width="620" height="86" rx="12" fill="#eadce9" stroke="#b58764" stroke-width="2"/><text x="500" y="116" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Menú: nombre y dificultad</text><path d="M500 164 L500 186" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="190" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="228" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Introducción, guía y conversación del refugio</text><path d="M500 276 L500 298" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="302" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="340" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Explorar: moverse, inspeccionar y recoger objetos</text><path d="M500 388 L500 410" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="414" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="452" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Activar mecanismos y entregar con consecuencias</text><path d="M500 500 L500 522" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><path d="M500 526 L810 569 L500 612 L190 569 Z" fill="#dfe8cf" stroke="#76936e" stroke-width="2"/><text x="500" y="564" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">¿Objetivos completos? No: seguir explorando</text><path d="M500 612 L500 634" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="638" width="620" height="86" rx="12" fill="#f5d4aa" stroke="#b58764" stroke-width="2"/><text x="500" y="676" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Sí: usar portal y avanzar al siguiente distrito</text><path d="M500 724 L500 746" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><path d="M500 750 L810 793 L500 836 L190 793 Z" fill="#dfe8cf" stroke="#76936e" stroke-width="2"/><text x="500" y="788" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">¿Cuarto distrito completo? No: nueva misión</text><path d="M500 836 L500 858" stroke="#9a6246" stroke-width="3" marker-end="url(#punta)"/><rect x="190" y="862" width="620" height="86" rx="12" fill="#eadce9" stroke="#b58764" stroke-width="2"/><text x="500" y="900" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#40323d">Sí: activar núcleo y mostrar victoria</text></svg>